name: Sync Auto Market final metrics

on:
  push:
    branches:
      - feature/auto-market-home-integration
    paths:
      - .github/workflows/sync-auto-market-metrics.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-market-home-integration
          fetch-depth: 0

      - name: Update homepage Auto Market metric
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="<!-- AUTO_MARKET_ASSISTANT_HOME -->"
          i=s.find(marker)
          if i < 0:
              raise SystemExit("Auto Market homepage marker not found")
          j=s.find("</section>", i)
          if j < 0:
              raise SystemExit("Auto Market section end not found")
          block=s[i:j]
          block=block.replace(">18 ms<", ">21 ms<")
          s=s[:i]+block+s[j:]
          p.write_text(s, encoding="utf-8")
          PY
          rm -f .github/workflows/sync-auto-market-metrics.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/sync-auto-market-metrics.yml
          git commit -m "Sync final Auto Market retrieval metric"
          git push origin HEAD:feature/auto-market-home-integration
