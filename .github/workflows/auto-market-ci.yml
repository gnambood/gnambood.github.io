name: Auto Market Assistant CI

on:
  pull_request:
    paths:
      - 'projects/auto-market-assistant/**'
      - '.github/workflows/auto-market-ci.yml'
  push:
    branches:
      - main
      - feature/auto-market-home-integration
    paths:
      - 'projects/auto-market-assistant/**'
      - '.github/workflows/auto-market-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/auto-market-assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.6 pydantic==2.10.4 pytest==8.3.4 httpx==0.28.1 ruff==0.8.4

      - name: Lint
        run: ruff check api tests

      - name: Test
        run: pytest -q
