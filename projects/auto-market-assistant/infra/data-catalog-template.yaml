AWSTemplateFormatVersion: '2010-09-09'
Description: Auto Market Assistant - curated Glue and Athena (deployed two-table schema)

Parameters:
  ArtifactBucketName:
    Type: String
    Description: Existing private S3 bucket with curated Parquet data.
  DatabaseName:
    Type: String
    Default: auto_market_curated
  AthenaWorkGroupName:
    Type: String
    Default: auto-market-analytics

Resources:
  CuratedDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName

  VehiclesTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref CuratedDatabase
      TableInput:
        Name: vehicles
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: 'true'
          projection.manufacturer.type: enum
          projection.manufacturer.values: ford,chevrolet,toyota,honda,nissan,jeep,ram,gmc,bmw,dodge
          storage.location.template: !Sub 's3://${ArtifactBucketName}/curated/vehicles/manufacturer=${!manufacturer}/'
        PartitionKeys:
          - Name: manufacturer
            Type: string
        StorageDescriptor:
          Location: !Sub 's3://${ArtifactBucketName}/curated/vehicles/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: id, Type: bigint}
            - {Name: region, Type: string}
            - {Name: price, Type: bigint}
            - {Name: year, Type: double}
            - {Name: model, Type: string}
            - {Name: condition, Type: string}
            - {Name: fuel, Type: string}
            - {Name: odometer, Type: double}
            - {Name: title_status, Type: string}
            - {Name: transmission, Type: string}
            - {Name: drive, Type: string}
            - {Name: type, Type: string}
            - {Name: state, Type: string}
            - {Name: posting_date, Type: timestamp}
            - {Name: posting_year, Type: int}
            - {Name: vehicle_age, Type: double}
            - {Name: price_extreme_flag, Type: boolean}
            - {Name: odometer_zero_flag, Type: boolean}
            - {Name: condition_missing, Type: bigint}
            - {Name: fuel_missing, Type: bigint}
            - {Name: title_status_missing, Type: bigint}
            - {Name: transmission_missing, Type: bigint}
            - {Name: drive_missing, Type: bigint}
            - {Name: type_missing, Type: bigint}
            - {Name: quality_issue_count, Type: bigint}
            - {Name: quality_band, Type: string}

  ReviewsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref CuratedDatabase
      TableInput:
        Name: reviews
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: 'true'
          projection.manufacturer.type: enum
          projection.manufacturer.values: ford,chevrolet,toyota,honda,nissan,jeep,ram,gmc,bmw,dodge
          storage.location.template: !Sub 's3://${ArtifactBucketName}/curated/reviews/manufacturer=${!manufacturer}/'
        PartitionKeys:
          - Name: manufacturer
            Type: string
        StorageDescriptor:
          Location: !Sub 's3://${ArtifactBucketName}/curated/reviews/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: review_id, Type: string}
            - {Name: vehicle_year, Type: bigint}
            - {Name: model, Type: string}
            - {Name: model_family, Type: string}
            - {Name: rating, Type: double}
            - {Name: review_title, Type: string}
            - {Name: review_text, Type: string}
            - {Name: document, Type: string}

  AnalyticsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Ref AthenaWorkGroupName
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub 's3://${ArtifactBucketName}/athena-results/'

Outputs:
  GlueDatabase:
    Value: !Ref CuratedDatabase
  AthenaWorkGroup:
    Value: !Ref AnalyticsWorkGroup
