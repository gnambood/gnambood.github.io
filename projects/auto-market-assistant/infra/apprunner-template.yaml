AWSTemplateFormatVersion: '2010-09-09'
Description: Auto Market Assistant FastAPI service on AWS App Runner.

Parameters:
  ImageIdentifier:
    Type: String
  ArtifactBucketName:
    Type: String
  ArtifactPrefix:
    Type: String
    Default: ''

Resources:
  ECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadAutoMarketArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${ArtifactBucketName}/*

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: auto-market-assistant
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt ECRAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '8080'
            RuntimeEnvironmentVariables:
              - Name: ARTIFACT_BUCKET
                Value: !Ref ArtifactBucketName
              - Name: ARTIFACT_PREFIX
                Value: !Ref ArtifactPrefix
              - Name: ENABLE_GENERATION
                Value: 'false'
              - Name: ALLOWED_ORIGINS
                Value: https://gnambood.github.io
      InstanceConfiguration:
        Cpu: '2 vCPU'
        Memory: '4 GB'
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Path: /health
        Protocol: HTTP

Outputs:
  ServiceUrl:
    Value: !GetAtt Service.ServiceUrl
  ServiceArn:
    Value: !GetAtt Service.ServiceArn
